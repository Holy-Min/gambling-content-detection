<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멈칫 · 클릭 시안</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1f7a4d;--blue:#2457b3;--red:#c93a3a;--ink:#1c2230;--sub:#5b6475;--line:#dfe3ea;--bg:#f1f3f6}
html,body{height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#d9dde4;color:var(--ink);display:flex;align-items:center;justify-content:center;word-break:keep-all;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
.phone{position:relative;width:412px;height:915px;max-height:100vh;background:#fff;border-radius:36px;border:8px solid #1c2230;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
@media (max-width:440px){body{display:block}.phone{border:0;border-radius:0;box-shadow:none;max-height:none}}
.demo{position:fixed;top:12px;right:12px;display:flex;gap:8px;font-size:13px}
.demo button{padding:6px 10px;border-radius:8px;border:1px solid #9aa3b2;background:#fff;cursor:pointer}
.demo button.on{background:var(--ink);color:#fff}
@media (max-width:700px){.demo{display:none}}
.status{position:absolute;top:0;left:0;right:0;height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;z-index:30;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.hdr{padding:36px 18px 14px;color:#fff;font-weight:700;font-size:18px}
.hdr small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-bottom:2px}
.hdr.green{background:var(--green)}.hdr.blue{background:var(--blue)}.hdr.red{background:var(--red)}
.body{flex:1;overflow:auto;padding:10px 16px 4px}
.foot{padding:10px 16px 18px;background:#fff;border-top:1px solid var(--line)}
.box{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
.note{font-size:12.5px;color:var(--sub);margin:2px 2px 10px}
.btn{display:block;width:100%;padding:14px 12px;border-radius:12px;border:2px solid transparent;font-size:16px;font-weight:700;cursor:pointer;text-align:center;margin-top:8px;line-height:1.3}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.9}
.btn.g{background:var(--green);color:#fff}.btn.b{background:var(--blue);color:#fff}.btn.r{background:var(--red);color:#fff}
.btn.og{border-color:var(--green);color:var(--green);background:#fff}.btn.ob{border-color:var(--blue);color:var(--blue);background:#fff}.btn.or{border-color:var(--red);color:var(--red);background:#fff}
.btn:disabled{border-color:#c9ced8;color:#8a93a3;background:#f3f4f7;cursor:not-allowed}
.btn.sm{padding:9px;font-size:14px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:15px;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;background:#e3ebfa;color:var(--blue);font-size:13.5px;font-weight:600}
.chip.sel{background:var(--green);color:#fff}
.chip.btnlike{cursor:pointer;border:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:10px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--green);width:18px;height:18px}
.opt b{font-size:15px}.opt span{display:block;font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.big{font-size:64px;font-weight:800;color:var(--red);text-align:center;letter-spacing:2px;line-height:1.1;margin:6px 0}
.scrim{position:absolute;inset:0;background:rgba(20,24,36,.55);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;top:78px;background:#fff;border-radius:22px 22px 0 0;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet.low{top:auto;max-height:70%;z-index:9}
.sheet .hdr{padding:18px 18px 14px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1c2230;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:20}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid #e1e5ec}
.stat:last-child{border:0}.stat b{font-size:22px}
/* mockups: generic CSS drawings, no real sites */
.mock{position:absolute;inset:0;background:#1d1433;color:#fff;padding:44px 16px 0}
.mock .bar{height:34px;border-radius:8px;background:#34255a;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#cbb8ff}
.reels{display:flex;gap:10px;justify-content:center;margin:18px 0}
.reel{width:84px;height:96px;border-radius:12px;background:#fff;color:#c93a3a;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center}
.promo{background:linear-gradient(90deg,#f2b705,#f28705);color:#3a2300;border-radius:12px;padding:12px;font-weight:800;text-align:center;font-size:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.tile{height:70px;border-radius:10px;background:#34255a}
.mock.light{background:#f4f1fb;color:var(--ink)}
.mock.light .bar{background:#e4dcf7;color:#4a3a85}
.amt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.amt div{padding:11px 0;text-align:center;border-radius:10px;background:#fff;border:1.5px solid #cfc6ea;font-weight:700}
.amt .on{background:#f28705;border-color:#f28705;color:#fff}
.pin{display:flex;gap:8px}.pin div{flex:1;padding:12px 0;text-align:center;background:#fff;border:1.5px solid #cfc6ea;border-radius:10px;letter-spacing:3px;font-weight:700}
.go{display:block;width:100%;margin-top:16px;padding:15px;border-radius:12px;background:#f28705;color:#fff;font-weight:800;font-size:17px;border:0;cursor:pointer}
/* messenger */
.chat{flex:1;background:#b9cde0;padding:12px;overflow:auto}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:14px;background:#8aa6c4;flex:none}
.nm{font-size:12px;color:#33465a;margin-bottom:3px}
.bub{background:#fff;border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:15px;max-width:260px}
.bub.me{background:#fee500;border-radius:14px 4px 14px 14px;margin-left:auto}
.linkcard{display:block;text-align:left;background:#fff;border:1px solid #cdd6e0;border-radius:12px;overflow:hidden;width:260px;cursor:pointer;margin-top:5px;padding:0}
.linkcard .th{height:78px;background:linear-gradient(135deg,#34255a,#7b4fd8);display:flex;align-items:center;justify-content:center;font-size:30px}
.linkcard div.tx{padding:8px 10px;font-size:13px}
.spin{width:64px;height:64px;border-radius:50%;border:7px solid #dce4f5;border-top-color:var(--blue);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* game mock */
.game{flex:1;background:linear-gradient(#5aa9f0,#2e6fc0);padding:44px 16px 10px;color:#fff;overflow:auto}
.gem{width:84px;height:84px;margin:12px auto;background:linear-gradient(135deg,#7ff3ff,#2fa7e6);transform:rotate(45deg) scale(.7);border-radius:14px;border:4px solid #fff}
.shop{background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-top:8px}
</style>
</head>
<body>
<div class="demo"><button id="speedBtn">타이머 10배속</button><button id="resetBtn">처음부터 다시</button></div>
<div class="phone" id="phone"><div class="status"><span id="clock">9:41</span><span>5G ▮▮▮</span></div><div id="view"></div></div>
<script>
"use strict";
const Q=new URLSearchParams(location.search);
let SPEED=Math.max(1,Number(Q.get('speed'))||1);
const LEVELS={notify:{n:'알려만 주기',d:'카드와 쿨다운만 보여 주고, 바로 계속할 수 있어요',r:1},
  pause:{n:'멈칫하기',d:'카드는 60초, 쿨다운은 30초 기다려야 계속할 수 있어요',r:2},
  block:{n:'충전 화면 막기',d:'충전 화면에서는 [계속] 버튼이 없어요',r:3}};
const EVIDENCE=["카지노","슬롯","이벤트","bet(베팅)"]; // 1차 모델 기여도 상위 n-gram에서 고름(가입·로그인 제외)
const fresh=()=>({promise:'엄마랑 다시 편하게 얘기하고 싶다',days:90,amount:180,showLost:false,saved:15,keptDays:3,notifyOff:false,
  level:LEVELS[Q.get('level')]?Q.get('level'):'pause',trusted:'사촌 형',trustOn:true,
  rec:{re:3,stop:3},
  sent:false,cdLeft:null,pendingOff:false,pendingLevel:null,fp:false,auto:false});
let S=fresh(), timer=null, cur='';
const $=(s)=>document.querySelector(s);
const man=(n)=>n>=10000?Math.floor(n/10000)+'만 원':n+'원';
const go=(n,auto)=>{S.auto=!!auto; if(location.hash==='#'+n) render(n); else location.hash=n;};
function tick(el,total,onTick){ // total초 카운트다운, SPEED배속
  let left=total; onTick(left);
  timer=setInterval(()=>{left=Math.max(0,left-0.25*SPEED); onTick(left); if(left<=0){clearInterval(timer);timer=null;}},250);
}
const mm=(s)=>{s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const lvlTxt=()=>LEVELS[S.level].n;

const mockSite=()=>`<div class="mock"><div class="bar">★ 카지노 로비 · 라이브</div>
<div class="promo" style="margin-top:14px">첫 충전 보너스 100%</div>
<div class="reels"><div class="reel">7</div><div class="reel">♦</div><div class="reel">7</div></div>
<div class="tiles"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div></div>`;
const mockCharge=()=>`<div class="mock light"><div class="bar">충전하기</div>
<div style="margin-top:18px;font-weight:700">충전 금액</div>
<div class="amt"><div>1만</div><div>3만</div><div class="on">5만</div><div>10만</div></div>
<div style="font-weight:700;margin-top:8px">문화상품권 핀 번호</div>
<div class="pin" style="margin-top:8px"><div>••••</div><div>••••</div><div>••••</div><div>••••</div></div>
<button class="go" id="chargeGo">충전하기</button></div>`;

const EXAMPLES=["내 용돈은 내가 쓰고 싶은 데 쓴다","친구랑 노는 시간을 되찾는다"];
const lostRow=(extra)=>S.showLost?`<div class="stat"><span>지금까지 잃은 돈</span><b>${S.amount+(extra||0)}만 원</b></div>`:'';
const offMsg=()=>S.trustOn&&S.notifyOff?`${S.trusted}에게 "○○ 님이 잠시 쉬겠다고 했어요" 한 줄이 가요.`:'신뢰인에게는 아무것도 가지 않아요.';
const V={};
V.onboarding=()=>`<div class="screen"><div class="hdr green"><small>약속 켜기</small><span id="appname">멈칫</span> · 약속 켜기</div>
<div class="body">
<p class="note" style="font-size:14px;color:var(--ink);margin-bottom:6px">이 기능은 내가 켜고, 내가 꺼요. 폰 안에서 화면을 자동으로 확인하고, 저장하지 않고 바로 지워요.</p>
<div class="box"><div class="lbl">내 약속</div><textarea id="in-promise" rows="2" style="height:62px">${S.promise}</textarea>
<div class="chips" style="margin-top:8px">${EXAMPLES.map((e,i)=>`<button class="chip btnlike" data-ex="${i}">${e}</button>`).join('')}</div>
<div class="lbl" style="margin-top:10px">약속 기간</div><div class="chips">${[30,90,180].map(d=>`<button class="chip btnlike ${S.days==d?'sel':''}" data-days="${d}">${d}일</button>`).join('')}</div>
<label class="opt" style="padding:10px 0 0"><input type="checkbox" id="in-showlost" ${S.showLost?'checked':''}><div><b>잃은 돈 합계 보기 (선택, 기본 끔)</b><span>켜면 카드·쿨다운에 잃은 돈 합계도 같이 보여요</span></div></label>
${S.showLost?`<div class="lbl" style="margin-top:6px">지금까지 잃은 돈 (만 원)</div><input type="text" id="in-amount" inputmode="numeric" value="${S.amount}">`:''}</div>
<div class="box"><div class="lbl">개입 강도 (지금 미리 정하는 약속)</div>
${Object.entries(LEVELS).map(([k,v])=>`<label class="opt"><input type="radio" name="lv" value="${k}" ${S.level==k?'checked':''}><div><b>${v.n}${k=='pause'?' (기본)':''}</b><span>${v.d}</span></div></label>`).join('')}
<p class="note" style="margin-top:4px">끄기·강도 낮추기는 24시간 뒤에 적용돼요. 높이기는 바로 적용돼요.</p></div>
<div class="box"><div class="lbl">신뢰인 (선택)</div><div class="row"><input type="text" id="in-trusted" value="${S.trusted}"></div>
<p class="note" style="margin:6px 0 8px">알림은 충전 시도 때만, 금액·유형만 가요.</p>
<div class="lbl">끌 때 신뢰인에게 알릴까요?</div>
<label class="opt" style="padding:4px 6px"><input type="radio" name="noff" value="0" ${S.notifyOff?'':'checked'}><div><b>알리지 않음 (기본)</b></div></label>
<label class="opt" style="padding:4px 6px"><input type="radio" name="noff" value="1" ${S.notifyOff?'checked':''}><div><b>알림</b></div></label></div>
<p class="note" style="margin-bottom:2px">정상 게임·중계·유튜브는 막지 않아요.</p></div>
<div class="foot"><button class="btn g" id="start" style="margin:0">브레이크 켜기</button></div></div>`;
V.chat=()=>`<div class="screen"><div class="hdr" style="background:#8aa6c4;color:#1c2a3a;font-size:16px"><small style="color:#33465a">단톡방 · 9명</small>우리반 (가상의 메신저)</div>
<div class="chat"><div class="msg"><div class="av"></div><div><div class="nm">민수</div><div class="bub">야 새 주소 떴다 ㅋㅋ</div></div></div>
<div class="msg"><div class="av"></div><div><div class="nm">준호</div><div class="bub">첫충 보너스 100%래 ㄱㄱ</div>
<button class="linkcard" id="link"><div class="th">♠ ♦ 7</div><div class="tx"><b>지금 바로 입장</b><br><span style="color:#6b7686">링크를 누르면 열려요 (가상 주소)</span></div></button></div></div>
<div class="msg"><div class="bub me">나 지금 누른다</div></div></div>
<div class="foot" style="background:#f5f7fa"><p class="note" style="margin:0">링크를 눌러 보세요. 멈칫이 폰 안에서 화면을 자동으로 확인해요.</p></div></div>`;
V.judging=()=>`<div class="screen" style="justify-content:center;text-align:center;padding:0 30px"><div class="spin"></div>
<h2 style="font-size:20px">화면을 확인하고 있어요</h2><p class="note" style="font-size:14px;margin-top:8px">주소가 아니라 글자와 모양으로 확인해요. 폰 안에서만 하고, 저장하지 않아요.</p></div>`;
V.card=()=>`${mockSite()}<div class="scrim"></div><div class="sheet"><div class="hdr blue">불법 도박 사이트일 가능성이 높아요</div>
<div class="body"><div class="lbl">판정 근거 (주소와 상관없이 화면의 글자와 모양에서 찾았어요)</div><div class="chips" id="chips" style="margin-bottom:12px">${EVIDENCE.map(e=>`<span class="chip">${e}</span>`).join('')}<span class="chip" style="background:#fff;border:1.5px solid var(--blue)">화면 모양(이미지)</span></div>
<div class="box"><div class="lbl">내가 쓴 약속</div><b style="font-size:17px">"${S.promise}"</b></div>
<p style="font-size:15px;margin:4px 2px 8px"><b>지켜 낸 날 ${S.keptDays}일</b> · 멈춰서 지킨 돈 <b>${S.saved}만 원</b>${S.showLost?`<br><span style="color:var(--sub)">잃은 돈 합계 ${S.amount}만 원</span>`:''}</p>
<button class="btn b" id="btn-exit">나가기<small>기본 선택이에요</small></button>
<button class="btn ob" id="btn-continue">계속 보기</button>
<p class="note" style="margin-top:12px">이 화면은 신뢰인에게 가지 않아요.</p></div></div>`;
V.charge=()=>`${mockCharge()}<div class="toast" style="bottom:60px;background:#34255a">시안: [충전하기]를 누르면 쿨다운이 떠요</div>`;
V.cooldown=()=>{const L=S.level;return `${mockCharge()}<div class="scrim"></div><div class="sheet"><div class="hdr red">충전 · 상품권 핀 입력 화면이에요</div>
<div class="body">${L==='pause'?'<div class="big" id="count">0:30</div>':L==='block'?'<div class="big" style="font-size:30px;padding:14px 0">충전 화면 막기 켜짐</div>':'<div class="big" style="font-size:30px;padding:14px 0">잠깐만요</div>'}
<div class="box"><div class="stat"><span>이번 충전</span><b>5만 원</b></div><div class="stat"><span>지금까지 멈춰서 지킨 돈</span><b>${S.saved}만 원</b></div>${lostRow(5)}</div>
<p class="note" style="color:var(--ink);font-size:14px">상품권은 넣지 않고 그대로 두면 돼요.</p>
<p class="note" id="cdnote">${L==='pause'?'30초만 멈춰요. 카운트가 끝나면 [계속]이 열려요.':L==='block'?'내가 정한 약속이라 이 화면에서는 계속할 수 없어요.':'알려만 주기라서 바로 계속할 수 있어요.'}</p>
<button class="btn r" id="btn-exit" style="margin-top:0">나가기</button>
<button class="btn or" id="btn-trusted">${S.trustOn?S.trusted+'에게 알리기':'신뢰인에게 알리기'}<small>보낼 내용 미리 보기 · 금액·유형만</small></button>
<button class="btn or" id="btn-1336">1336 익명 채팅</button>
${L==='block'?'':`<button class="btn or" id="btn-continue" ${L==='pause'?'disabled':''}>계속</button>`}</div></div>`;};
V['cooldown-done']=V.cooldown;
V['trusted-preview']=()=>`${V.cooldown()}<div class="scrim" style="z-index:8"></div><div class="sheet low"><div class="hdr red" style="padding:14px 18px">${S.trusted}에게 이렇게 가요</div>
<div class="body" style="flex:none"><div class="box" style="background:#fff4f4;border:2px solid var(--red)"><b style="font-size:18px">충전 시도 · 5만 원 · 카지노형</b></div>
<p class="note">이것만 가요. 사이트 이름·화면·내 약속·잃은 돈 합계는 안 가요.</p>
<div class="box" id="guide"><div class="lbl">받는 분께 함께 가는 안내</div><p style="font-size:14px">스스로 도움을 청한 거예요. 혼내기 전에 먼저 들어 주세요. 보호자 상담은 1336에서도 받을 수 있어요.</p></div>
<div class="row"><button class="btn r" id="tp-send" style="flex:1">보내기</button><button class="btn or" id="tp-cancel" style="flex:1">보내지 않기</button></div></div></div>`;
V.record=()=>`<div class="screen"><div class="hdr green"><small>폰 안에만 저장돼요</small>나의 기록</div><div class="body">
<div class="box"><div class="stat"><span>이번 주 재접속</span><b>${S.rec.re}회</b></div><div class="stat"><span>멈춘 횟수</span><b>${S.rec.stop}회</b></div><div class="stat"><span>멈춘 금액</span><b>${S.saved}만 원</b></div></div>
<p class="note">기록은 이 폰에만 있고 밖으로 나가지 않아요.</p>
<p class="lbl" style="margin-top:6px">정상 게임인데 잡혔나요?</p><p class="note" style="margin-top:0">"정상 게임"으로 표시하면 이 폰에서만 예외가 돼요.</p>
<button class="btn og" id="b1336">1336 도박문제 헬프라인</button>
<button class="btn og" id="bchat">1336 익명 채팅</button>
<p class="note" style="margin-top:12px">${S.trustOn?S.trusted+'에게 가는 알림 미리 보기: "충전 시도 · 5만 원 · 카지노형" (내가 켠 경우만)':'신뢰인 알림은 꺼져 있어요'}</p>
<button class="btn og sm" id="toSettings">브레이크 설정 보기</button></div></div>`;
V.settings=()=>`<div class="screen"><div class="hdr green"><small>브레이크 설정</small>개입 강도</div><div class="body">
${S.pendingOff?`<div class="box" style="background:#fff4de;border:2px solid #f0a21a" id="pendingBox"><b>24시간 뒤에 꺼져요</b><p class="note" style="margin:4px 0 0;color:var(--ink)">그때까지는 지금 강도(${lvlTxt()})로 지켜 줘요. ${offMsg()}</p></div>`:''}
${S.pendingLevel?`<div class="box" style="background:#fff4de;border:2px solid #f0a21a"><b>${LEVELS[S.pendingLevel].n}으로 24시간 뒤 바뀌어요</b></div>`:''}
<div class="box">${Object.entries(LEVELS).map(([k,v])=>`<label class="opt"><input type="radio" name="lv" value="${k}" ${S.level==k?'checked':''}><div><b>${v.n}${S.level==k?' (지금)':''}</b><span>${v.d}</span></div></label>`).join('')}</div>
<p class="note">강도를 낮추거나 끄면 24시간 뒤에 적용돼요. 높이면 바로 적용돼요.</p>
<label class="opt" style="padding:0 0 8px"><input type="checkbox" id="setLost" ${S.showLost?'checked':''}><div><b>잃은 돈 합계 보기 (기본 끔)</b></div></label>
${S.pendingOff?`<button class="btn og" id="cancelOff">끄기 취소하고 계속 지키기</button>`:`<button class="btn or" id="turnOff">브레이크 끄기</button>`}
<button class="btn og sm" id="toRecord">나의 기록으로</button></div></div>`;
V['settings-off']=V.settings;
V['game-pay']=()=>`<div class="screen"><div class="game"><div style="font-weight:800;font-size:20px">보석 상점 <span style="font-size:12px;font-weight:500;opacity:.9">· 모바일 게임 (가상)</span></div>
<div class="gem"></div><div class="shop"><div class="row" style="justify-content:space-between"><b style="font-size:18px">보석 1,200개</b><b style="font-size:18px">₩12,000</b></div>
<button class="btn g" id="buy" style="background:#2e6fc0">구매하기</button></div>
<div class="box" style="margin-top:14px;background:rgba(255,255,255,.92);color:var(--ink)"><b style="color:var(--green)">멈칫</b><p class="note" style="margin:2px 0 0">도박 화면으로 보이지 않아 그대로 둬요.</p></div></div>
<div class="foot" style="text-align:center"><button id="fpLink" style="background:none;border:0;color:var(--sub);text-decoration:underline;font-size:13px;cursor:pointer">잘못 잡혔나요? 정상 게임으로 표시</button></div>
${S.fp?`<div class="toast" id="fpToast" style="bottom:70px;line-height:1.5"><b>잘못 잡아서 미안해요. 이 게임은 앞으로 확인하지 않을게요.</b><br>신뢰인에게는 아무것도 가지 않아요.<br><span style="font-size:12px;opacity:.85">정상 게임 표시는 하루 3번까지 쓸 수 있어요.</span></div>`:''}</div>`;
V['game-pay-false-positive']=()=>{S.fp=true;return V['game-pay']();};

function render(name){
  if(timer){clearInterval(timer);timer=null;}
  if(!V[name]){name='onboarding';}
  cur=name;
  if(name==='settings-off') S.pendingOff=true;
  if(!['cooldown','cooldown-done','trusted-preview'].includes(name)) S.cdLeft=null; // 미리보기를 열고 닫아도 쿨다운 남은 시간 유지
  if(name!=='game-pay-false-positive'&&name!=='game-pay') S.fp=false;
  $('#view').innerHTML=V[name]();
  const on=(id,fn)=>{const e=$(id);if(e)e.addEventListener('click',fn);};
  const auto=S.auto; S.auto=false;
  if(name==='onboarding'){
    const save=()=>{S.promise=$('#in-promise').value;if($('#in-amount'))S.amount=parseInt($('#in-amount').value)||S.amount;S.trusted=$('#in-trusted').value;};
    document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{save();S.days=+b.dataset.days;render('onboarding');});
    document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{save();S.promise=EXAMPLES[+b.dataset.ex];render('onboarding');});
    $('#in-showlost').onchange=()=>{save();S.showLost=$('#in-showlost').checked;render('onboarding');};
    document.querySelectorAll('[name=lv]').forEach(r=>r.onchange=()=>S.level=r.value);
    document.querySelectorAll('[name=noff]').forEach(r=>r.onchange=()=>S.notifyOff=r.value==='1');
    on('#start',()=>{save();S.promise=S.promise||'엄마랑 다시 편하게 얘기하고 싶다';S.trusted=S.trusted||'사촌 형';go('chat');});
  }
  if(name==='chat') on('#link',()=>go('judging',true));
  if(name==='judging'&&auto) setTimeout(()=>{if(cur==='judging')go('card');},1800/SPEED);
  if(name==='card'){
    const c=$('#btn-continue');
    if(S.level==='notify'){c.disabled=false;}
    else{c.disabled=true;tick(c,60,l=>{if(!$('#btn-continue'))return;if(l<=0){c.disabled=false;c.textContent='계속 보기';}else c.textContent='계속 보기 ('+Math.ceil(l)+'초 뒤 가능)';});}
    on('#btn-exit',()=>{S.rec.re++;S.rec.stop++;go('record');});
    on('#btn-continue',()=>go('charge'));
  }
  if(name==='charge') on('#chargeGo',()=>{S.cdLeft=null;go('cooldown');});
  if(name==='cooldown'||name==='cooldown-done'||name==='trusted-preview'){
    const c=$('#btn-continue'),cnt=$('#count');
    if(S.level==='pause'&&cnt){
      if(name==='cooldown-done'){cnt.textContent='0:00';c.disabled=false;$('#cdnote').textContent='기다려 줘서 고마워요. 이제 [계속]을 누를 수 있어요.';}
      else tick(null,S.cdLeft===null?30:S.cdLeft,l=>{S.cdLeft=l;if(!$('#count'))return;$('#count').textContent=mm(l);if(l<=0){const b=$('#btn-continue');if(b)b.disabled=false;const n=$('#cdnote');if(n)n.textContent='기다려 줘서 고마워요. 이제 [계속]을 누를 수 있어요.';}});
    }
    if(S.level==='notify'&&c) c.disabled=false;
    on('#btn-exit',()=>{S.rec.stop++;S.saved+=5;go('record');});
    on('#btn-trusted',()=>go('trusted-preview'));
    on('#btn-1336',()=>sheet1336());
    on('#btn-continue',()=>{toast('계속했어요. 이 선택은 기록에만 남아요.');});
    on('#tp-send',()=>{S.sent=true;go('cooldown');setTimeout(()=>toast(S.trusted+'에게 보냈어요.'),50);});
    on('#tp-cancel',()=>go('cooldown'));
  }
  if(name==='record'){on('#b1336',()=>sheet1336());on('#bchat',()=>sheet1336());on('#toSettings',()=>go('settings'));}
  if(name==='settings'||name==='settings-off'){
    document.querySelectorAll('[name=lv]').forEach(r=>r.onchange=()=>{
      if(LEVELS[r.value].r>LEVELS[S.level].r){S.level=r.value;S.pendingLevel=null;render(cur);toast('바로 적용됐어요.');}
      else if(r.value!==S.level){S.pendingLevel=r.value;render(cur);}
    });
    on('#turnOff',()=>{S.pendingOff=true;go('settings-off');});
    on('#cancelOff',()=>{S.pendingOff=false;go('settings');});
    on('#toRecord',()=>go('record'));
    on('#setLost',()=>{S.showLost=$('#setLost').checked;render(cur);});
  }
  if(name==='game-pay'||name==='game-pay-false-positive'){
    on('#fpLink',()=>go('game-pay-false-positive'));
  }
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#view').firstElementChild.appendChild(d);setTimeout(()=>d.remove(),2500);}
function sheet1336(){
  const s=document.createElement('div');
  s.innerHTML='<div class="scrim" style="z-index:12"></div><div class="sheet low" style="z-index:13"><div class="hdr green" style="padding:14px 18px">1336 · 도박문제 헬프라인</div><div class="body" style="flex:none"><p style="font-size:15px">전화 1336, 또는 익명 채팅으로 이야기할 수 있어요. 이름은 안 물어봐요. (시안: 실제 연결은 되지 않아요)</p><button class="btn g" id="closeS">닫기</button></div></div>';
  $('#view').firstElementChild.appendChild(s);$('#closeS').onclick=()=>s.remove();
}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));
$('#speedBtn').onclick=()=>{SPEED=SPEED>1?1:10;$('#speedBtn').classList.toggle('on',SPEED>1);};
$('#speedBtn').classList.toggle('on',SPEED>1);
$('#resetBtn').onclick=()=>{S=fresh();if(location.hash==='#onboarding')render('onboarding');else location.hash='onboarding';};
render(location.hash.slice(1)||'onboarding');
</script>
</body>
</html>
